# ─── JVM Memory ───────────────────────────────────────────────────────────────
# i9-13900H has 16GB RAM — 6GB heap for Gradle, 2GB metaspace
# G1GC handles large heaps better than default GC (fewer pauses, lower latency)
org.gradle.jvmargs=-Xmx6g -Xms1g -XX:MaxMetaspaceSize=2g \
  -XX:+UseG1GC -XX:G1HeapRegionSize=16m \
  -XX:+HeapDumpOnOutOfMemoryError \
  -Dfile.encoding=UTF-8

# ─── Parallelism ──────────────────────────────────────────────────────────────
# i9-13900H = 6 P-cores + 8 E-cores = 20 threads
# Use 16 workers (leave 4 for system/IDE/Chrome)
org.gradle.parallel=true
org.gradle.workers.max=16
org.gradle.daemon=true
# Keep daemon alive for 3 hours (long dev sessions)
org.gradle.daemon.idletimeout=10800000

# ─── Build Cache ──────────────────────────────────────────────────────────────
# NVMe SSD (PCIe 4.0) makes cache reads near-instant
# Cached tasks skip re-compilation → dramatically faster incremental builds
org.gradle.caching=true

# ─── Configuration Cache ──────────────────────────────────────────────────────
# Disabled — AGP + Kotlin plugin can't serialize WeakHashMap/ReferenceQueue
# (java.base module restriction). Re-enable when AGP adds full support.
org.gradle.configuration-cache=false

# ─── Kotlin Compiler ──────────────────────────────────────────────────────────
# Incremental compilation — only recompile changed files
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
# Kotlin daemon gets its own 2GB so it doesn't fight Gradle for memory
kotlin.daemon.jvm.options=-Xmx2g -Xms512m -XX:+UseG1GC

# ─── Android ──────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=false
# R8 full mode = more aggressive dead code removal → smaller APK
android.enableR8.fullMode=true
# Suppress non-transitive R class warning
android.nonTransitiveRClass=true
